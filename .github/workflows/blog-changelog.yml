name: blog-changelog

# Job body lives in noisypigeon/pigeon-lib (ADR-0155, moved by LIB-0002) -- this file keeps only
# the trigger, permissions and concurrency, plus the path filter and the
# merged-only gate, neither of which can live in another repo.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "noisypigeon.com/src/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/pigeon-lib/.github/workflows/blog-changelog.yml@workflows/v1.0.2
    with:
      site_dir: noisypigeon.com
      # This repo is one blog and nothing else, so its changelog lives at the
      # root and the cross-workload rollup is redundant: naming changelog_path
      # decouples it from site_dir (which still resolves the daily digest), and
      # an empty root_changelog_tag is the reusable workflow's opt-out. NPC-0000.
      changelog_path: CHANGELOG.md
      deploy_workflow: noisypigeon-com-pages.yml
    secrets: inherit
