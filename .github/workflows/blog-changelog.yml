name: blog-changelog

# Job body lives in noisypigeon/pigeon-lib (ADR-0155, moved by LIB-0002) -- this file keeps only
# the trigger, permissions and concurrency, plus the path filter and the
# merged-only gate, neither of which can live in another repo.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "web/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/pigeon-lib/.github/workflows/blog-changelog.yml@workflows/v1.1.0
    with:
      src_dir: web
      # The blog's long-form changelog (full PR bodies) lives beside the site
      # at web/CHANGELOG.md -- the unit changelog of DEV-0160's contract. The
      # root CHANGELOG.md's one line per PR is root-changelog.yml's alone, so
      # root_changelog_tag stays empty (the reusable workflow's opt-out) or a
      # blog PR would get two root lines. COM-0001.
      changelog_path: web/CHANGELOG.md
      deploy_workflow: noisypigeon-com-pages.yml
    secrets: inherit
