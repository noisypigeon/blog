name: blog-changelog

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "web/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/library/.github/workflows/blog-changelog.yml@workflows/v4.8.0
    with:
      src_dir: web
      # root_changelog_tag stays unset, or a blog PR would get two root lines.
      changelog_path: web/CHANGELOG.md
      deploy_workflow: blog-pages.yml
    secrets: inherit
