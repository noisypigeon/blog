name: blog-changelog

# Job body lives in noisypigeon/pigeon-lib (ADR-0155, moved by LIB-0002) -- this file keeps only
# the trigger, permissions and concurrency, plus the path filter and the
# merged-only gate, neither of which can live in another repo.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "web/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/pigeon-lib/.github/workflows/blog-changelog.yml@workflows/v1.1.0
    with:
      src_dir: web
      # This repo is one blog and nothing else, so its changelog lives at the
      # root and the cross-workload rollup is redundant: naming changelog_path
      # decouples it from the site root (src_dir, which still resolves the daily
      # digest), and an empty root_changelog_tag is the reusable workflow's
      # opt-out. COM-0000 (filed as NPC-0000).
      changelog_path: CHANGELOG.md
      deploy_workflow: noisypigeon-com-pages.yml
    secrets: inherit
