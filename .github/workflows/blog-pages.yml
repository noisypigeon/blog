# Lives here, not in library: deploy-pages only deploys the calling repo's site.
name: Deploy blog

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: blog-pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: noisypigeon/library/.github/workflows/zola-site-pages.yml@workflows/v4.5.0
    with:
      src_dir: web
      build_cmd: "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build"
      fetch_script: fetch-lib.sh
      theme_script: .lib-src/zola-site/resolve-theme.sh
