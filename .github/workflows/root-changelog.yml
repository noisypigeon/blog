name: root-changelog

# Every merged PR gets exactly one line in the root CHANGELOG.md (DEV-0160,
# adopted here by COM-0001). A blog PR additionally gets its full body in
# web/CHANGELOG.md, written by blog-changelog.yml -- which deliberately writes
# no root line, so this workflow is the root file's only writer.
#
# A thin caller since COM-0002: the job body -- fetch the library, pick the
# tag, run root-changelog.sh, push with retry -- lives in pigeon-lib's
# spoke-root-changelog.yml, at the version /.lib-version pins. This file keeps
# only the trigger, the merged-only gate, permissions, concurrency, and this
# repo's tag precedence.
#
# Deliberately no `paths:` filter: the whole point is that no merged PR is
# exempt.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Own group, not blog-changelog's main-writer: GitHub keeps one pending run per
# group, so sharing can silently drop a writer. The reusable retries a rejected
# push instead.
concurrency:
  group: main-writer-rollup
  cancel-in-progress: false

jobs:
  rollup:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/pigeon-lib/.github/workflows/spoke-root-changelog.yml@workflows/v1.5.1
    with:
      # First match wins.
      precedence: |
        ^web/=blog
        ^(terraform/|root\.hcl$|spoke\.hcl$|\.sops\.yaml$)=terraform
        ^adr/=adr
        ^\.github/=ci
    secrets: inherit
