[tools]
# Keep in step with the library's zola-site-pages.yml, which is what CI builds
# with.
zola = "0.23.6"
terraform = "1.16.3"
terragrunt = "1.1.6"
sops = "3.13.3"

[env]
# terragrunt defaults to invoking `tofu`; this family standardizes on Terraform.
TG_TF_PATH = "terraform"

# The theme lives in noisypigeon/library under zola-site/ (ADR-0154, moved
# and flattened by LIB-0002) and is fetched into .lib-src/ rather than vendored
# here, so a fresh clone has no theme until this runs. Doing it on
# `mise install` means setup is one command; the cost is that `mise install`
# now reaches the network.
[hooks]
postinstall = "./fetch-lib.sh"

# resolve-theme.sh resolves its library root from its own location rather than
# the invoking site's, so running the copy under .lib-src/ from web/
# correctly materializes web/themes/zola-site at the version config.toml pins.
# SITE_COMMIT_SHA matches what CI passes, so local output matches deployed.
[tasks.blog-build]
dir = "web"
run = [
  "../fetch-lib.sh",
  "../.lib-src/zola-site/resolve-theme.sh",
  "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build",
]

[tasks.blog-serve]
dir = "web"
run = [
  "../fetch-lib.sh",
  "../.lib-src/zola-site/resolve-theme.sh",
  "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola serve",
]

# Terraform (COM-0003). root.hcl is generated from the library's template at the
# version spoke.hcl pins and committed; terraform-prepare regenerates it, so
# after bumping root_hcl_version, run it and commit the diff. The leaves under
# terraform/ keep the state keys they had in noisypigeon.
[tasks.terraform-prepare]
run = [
  "./fetch-lib.sh",
  ".lib-src/.github/scripts/resolve-root-hcl.sh",
]

[tasks.plan]
depends = ["terraform-prepare"]
run = "terragrunt run --all -- plan"

[tasks.apply]
depends = ["terraform-prepare"]
run = "terragrunt run --all -- apply"

[tasks.fmt-terraform]
run = ["terragrunt hcl format", "terraform fmt -recursive terraform"]

[tasks.fmt-check-terraform]
run = ["terragrunt hcl format --check", "terraform fmt -recursive -check terraform"]

[tasks.secrets-edit]
usage = 'arg "<file>" help="terraform, cloudflare, scaleway, backblaze or env"'
run = "sops --input-type dotenv --output-type dotenv terraform/secrets/{{arg(name=\"file\")}}.enc"
