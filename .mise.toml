[tools]
# Keep in step with library's zola-site-pages.yml.
zola = "0.23.6"
terraform = "1.16.3"
terragrunt = "1.1.6"
sops = "3.13.3"

[env]
# terragrunt defaults to `tofu`.
TG_TF_PATH = "terraform"

[hooks]
postinstall = "./fetch-lib.sh"

# SITE_COMMIT_SHA matches what CI passes.
[tasks.blog-build]
dir = "web"
run = [
  "../fetch-lib.sh",
  "../.lib-src/zola-site/resolve-theme.sh",
  "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build",
]

[tasks.blog-serve]
dir = "web"
run = [
  "../fetch-lib.sh",
  "../.lib-src/zola-site/resolve-theme.sh",
  "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola serve",
]

[tasks.terraform-prepare]
run = [
  "./fetch-lib.sh",
  ".lib-src/.github/scripts/resolve-root-hcl.sh",
]

[tasks.plan]
depends = ["terraform-prepare"]
run = "terragrunt run --all -- plan"

[tasks.apply]
depends = ["terraform-prepare"]
run = "terragrunt run --all -- apply"

[tasks.fmt-terraform]
run = ["terragrunt hcl format", "terraform fmt -recursive terraform"]

[tasks.fmt-check-terraform]
run = ["terragrunt hcl format --check", "terraform fmt -recursive -check terraform"]

[tasks.secrets-edit]
usage = 'arg "<file>" help="terraform, cloudflare, scaleway, backblaze or env"'
run = "sops --input-type dotenv --output-type dotenv terraform/secrets/{{arg(name=\"file\")}}.enc"
