[tools]
# Keep in step with pigeon-lib's zola-site-pages.yml, which is what CI builds
# with.
zola = "0.23.6"

# The theme lives in noisypigeon/pigeon-lib under zola-site/ (ADR-0154, moved
# and flattened by LIB-0002) and is fetched into .lib-src/ rather than vendored
# here, so a fresh clone has no theme until this runs. Doing it on
# `mise install` means setup is one command; the cost is that `mise install`
# now reaches the network.
[hooks]
postinstall = "./fetch-lib.sh"

# resolve-theme.sh resolves its library root from its own location rather than
# the invoking site's, so running the copy under .lib-src/ from web/
# correctly materializes web/themes/zola-site at the version config.toml pins.
# SITE_COMMIT_SHA matches what CI passes, so local output matches deployed.
[tasks.blog-build]
dir = "web"
run = [
  "../fetch-lib.sh",
  "../.lib-src/zola-site/resolve-theme.sh",
  "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build",
]

[tasks.blog-serve]
dir = "web"
run = [
  "../fetch-lib.sh",
  "../.lib-src/zola-site/resolve-theme.sh",
  "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola serve",
]
